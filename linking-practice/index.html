<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日美语</title>
<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日美语">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 字体异步加载：网络慢时先用系统字体，不卡页面 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <main>
    <section class="view" id="v-today"></section>
    <section class="view" id="v-review" hidden></section>
    <section class="view" id="v-library" hidden></section>
    <section class="view" id="v-words" hidden></section>
    <section class="view" id="v-listen" hidden></section>
    <section class="view" id="v-speak" hidden></section>
    <section class="view" id="v-link" hidden></section>
    <section class="view" id="v-me" hidden></section>
  </main>

  <div class="tabs">
    <nav aria-label="主导航">
      <a href="#today" data-tab="today" style="--c:var(--ink)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M6 7.2v9.6M8 6.2l8 4.6M8 17.8l8-4.6"/></svg>今日</a>
      <a href="#listen" data-tab="listen" style="--c:var(--orange)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.8"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.8"/></svg>听力</a>
      <a href="#speak" data-tab="speak" style="--c:var(--green)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v10H10l-4.5 4v-4H4z"/><path d="M8.5 10.5h7" stroke-linecap="round"/></svg>口语</a>
      <a href="#link" data-tab="link" style="--c:var(--purple)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 9c0 4.5 3.5 7 9 7s9-2.5 9-7"/><path d="M3 5v2M21 5v2"/></svg>连读</a>
      <a href="#me" data-tab="me" style="--c:var(--ink)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/></svg>我的</a>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="data.js?v=11"></script>
  <script src="words.js?v=11"></script>
  <script src="vocab.js?v=11"></script>
  <script src="linking.js?v=11"></script>
  <script src="core.js?v=11"></script>
  <script src="replies_zh.js?v=11"></script>
  <script src="neural.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
