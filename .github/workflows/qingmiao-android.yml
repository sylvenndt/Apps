name: 轻描 Android 打包

on:
  push:
    branches: [main]
    paths:
      - 'qingmiao/android/**'
      - '.github/workflows/qingmiao-android.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: qingmiao-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            qingmiao/android/**/*.gradle.kts
            qingmiao/android/gradle/wrapper/gradle-wrapper.properties

      - name: 下载 AI 模型
        run: |
          M=qingmiao/android/app/src/main/assets/models
          mkdir -p $M
          curl -fL --retry 3 -o $M/selfie_multiclass_256x256.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite
          curl -fL --retry 3 -o $M/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
          curl -fL --retry 3 -o $M/realesrgan_general_x4v3.tflite https://huggingface.co/qualcomm/Real-ESRGAN-General-x4v3/resolve/a6187b71ae917c51ec0c957eae66ff0bdac92508/Real-ESRGAN-General-x4v3.tflite
          curl -fL --retry 3 -o $M/realesrgan_x4plus.tflite https://huggingface.co/qualcomm/Real-ESRGAN-x4plus/resolve/d1464ff1d56afc8ab662b3933a9cd866968ee21e/Real-ESRGAN-x4plus.tflite
          curl -fL --retry 3 -o $M/lama_dilated.tflite https://huggingface.co/qualcomm/LaMa-Dilated/resolve/main/LaMa-Dilated.tflite
          ls -la $M

      - name: 编译 APK
        working-directory: qingmiao/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          APK=qingmiao/android/app/build/outputs/apk/release/app-release.apk
          cp $APK qingmiao.apk
          SIZE=$(stat -c%s qingmiao.apk)
          gh release delete qingmiao-latest --yes --cleanup-tag || true
          gh release create qingmiao-latest qingmiao.apk \
            --title "轻描 v0.1.$RUN" --notes "轻描安卓安装包（自动构建）。下载页：https://sylvenndt.github.io/Apps/qingmiao/"
          echo "{\"version\":\"0.1.$RUN\",\"built\":\"$(date -u +%Y-%m-%dT%H:%MZ)\",\"size\":$SIZE,\"url\":\"https://github.com/sylvenndt/Apps/releases/download/qingmiao-latest/qingmiao.apk\"}" > qingmiao/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qingmiao/version.json
          git commit -m "轻描：自动打包 v0.1.$RUN"
          git pull --rebase origin main
          git push origin HEAD:main
