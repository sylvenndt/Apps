name: 清理轻描发布
on:
  push:
    paths: ['.github/workflows/cleanup-qingmiao.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete qingmiao-latest --yes --cleanup-tag -R ${{ github.repository }}
